services:
  mail2bark:
    build: .
    image: mail2bark:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "2525:2525"
      # Map these only when the host firewall restricts access appropriately.
      # - "25:25"
      # - "465:465"
      # - "587:587"
    environment:
      MAIL2BARK_ADMIN_KEY: ${MAIL2BARK_ADMIN_KEY:-}
      MAIL2BARK_HTTP_ADDR: ":8080"
      MAIL2BARK_SMTP_ADDR: ":2525"
      MAIL2BARK_DB_PATH: /data/mail2bark.db
      MAIL2BARK_MAX_MESSAGE_BYTES: "10485760"
      MAIL2BARK_TLS_CERT: /certs/fullchain.pem
      MAIL2BARK_TLS_KEY: /certs/privkey.pem
    volumes:
      - mail2bark-data:/data
      # 默认为空；启用 SMTP TLS 时再放入证书。
      - mail2bark-certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MAIL2BARK_DOMAIN: ${MAIL2BARK_DOMAIN:-notify.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      mail2bark:
        condition: service_healthy
volumes:
  mail2bark-data:
  mail2bark-certs:
  caddy-data:
  caddy-config:
